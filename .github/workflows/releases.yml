name: Releases

on:
  push:
    branches:
      - master
    tags:
      - v*

jobs:
  apk:
    runs-on: ubuntu-24.04
    env:
      # The devshell moves Gradle's home into the repository (flake.nix);
      # setup-gradle caches the one this names, so both agree.
      GRADLE_USER_HOME: ${{ github.workspace }}/android/.gradle-home
      # android/app/build.gradle.kts reads PIMALAYA_*, the key alias
      # defaulting to pimalaya.
      PIMALAYA_KEYSTORE_PASSWORD: ${{ secrets.PIMALAYA_KEYSTORE_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - uses: cachix/install-nix-action@v31
        with:
          extra_nix_config: experimental-features = nix-command flakes
      - uses: cachix/cachix-action@v17
        with:
          name: soywod
          authToken: ${{ secrets.CACHIX_AUTH_TOKEN }}
          extraPullNames: nix-community
      # NOTE: the runner's own cargo computes the key, so the flake lock
      # joins it: a toolchain bump in the devshell starts a fresh cache.
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust -> target
          key: ${{ hashFiles('flake.lock') }}
      - uses: gradle/actions/setup-gradle@v6
      # Decode the keystore only when the secret is present; otherwise the
      # build proceeds and emits an unsigned APK.
      - name: Decode signing keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.PIMALAYA_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/pimalaya.jks"
            echo "PIMALAYA_KEYSTORE=$RUNNER_TEMP/pimalaya.jks" >> "$GITHUB_ENV"
          fi
      # The APKs for direct installs, the bundle for Google Play, which
      # serves each phone its own ABI from it. Two runs: a bundle build
      # turns the ABI splits off (android/app/build.gradle.kts).
      - name: Assemble release APKs
        run: nix develop --command bash -c 'cd android && gradle :app:assembleRelease'
      - name: Assemble release bundle
        run: nix develop --command bash -c 'cd android && gradle :app:bundleRelease'
      # Rename each split (and the universal) to its published name; the
      # *.apk glob absorbs the -unsigned suffix when no keystore is set.
      - name: Collect the APKs and the bundle
        run: |
          out=android/app/build/outputs/apk/release
          cp "$out"/app-universal-release*.apk pimalaya.apk
          for abi in arm64-v8a armeabi-v7a x86_64 x86; do
            cp "$out/app-$abi-release"*.apk "pimalaya-$abi.apk"
          done
          cp android/app/build/outputs/bundle/release/app-release.aab pimalaya.aab
      - uses: actions/upload-artifact@v4
        with:
          name: pimalaya
          path: pimalaya.apk
      - uses: actions/upload-artifact@v4
        with:
          name: pimalaya-aab
          path: pimalaya.aab
      - uses: actions/upload-artifact@v4
        with:
          name: pimalaya-arm64-v8a
          path: pimalaya-arm64-v8a.apk
      - uses: actions/upload-artifact@v4
        with:
          name: pimalaya-armeabi-v7a
          path: pimalaya-armeabi-v7a.apk
      - uses: actions/upload-artifact@v4
        with:
          name: pimalaya-x86_64
          path: pimalaya-x86_64.apk
      - uses: actions/upload-artifact@v4
        with:
          name: pimalaya-x86
          path: pimalaya-x86.apk
      - uses: softprops/action-gh-release@v2
        if: ${{ startsWith(github.ref, 'refs/tags/') }}
        with:
          files: |
            pimalaya.apk
            pimalaya-arm64-v8a.apk
            pimalaya-armeabi-v7a.apk
            pimalaya-x86_64.apk
            pimalaya-x86.apk
