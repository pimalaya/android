name: Releases

on:
  push:
    branches:
      - master
    tags:
      - v*

jobs:
  apk:
    runs-on: ubuntu-24.04
    env:
      # The repository's signing secrets keep the app's former name: they
      # hold the keystore the cardamum builds were signed with, whose key
      # alias is cardamum. android/app/build.gradle.kts reads PIMALAYA_*.
      PIMALAYA_KEYSTORE_PASSWORD: ${{ secrets.CARDAMUM_KEYSTORE_PASSWORD }}
      PIMALAYA_KEYSTORE_ALIAS: cardamum
    steps:
      - uses: actions/checkout@v4
      - uses: cachix/install-nix-action@v31
        with:
          extra_nix_config: experimental-features = nix-command flakes
      - uses: cachix/cachix-action@v16
        with:
          name: soywod
          authToken: ${{ secrets.CACHIX_AUTH_TOKEN }}
          extraPullNames: nix-community
      # Decode the keystore only when the secret is present; otherwise the
      # build proceeds and emits an unsigned APK.
      - name: Decode signing keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.CARDAMUM_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/pimalaya.jks"
            echo "PIMALAYA_KEYSTORE=$RUNNER_TEMP/pimalaya.jks" >> "$GITHUB_ENV"
          fi
      - name: Assemble release APKs
        run: nix develop --command bash -c 'cd android && gradle :app:assembleRelease'
      # Rename each split (and the universal) to its published name; the
      # *.apk glob absorbs the -unsigned suffix when no keystore is set.
      - name: Collect the APKs
        run: |
          out=android/app/build/outputs/apk/release
          cp "$out"/app-universal-release*.apk pimalaya.apk
          for abi in arm64-v8a armeabi-v7a x86_64 x86; do
            cp "$out/app-$abi-release"*.apk "pimalaya-$abi.apk"
          done
      - uses: actions/upload-artifact@v4
        with:
          name: pimalaya
          path: pimalaya.apk
      - uses: actions/upload-artifact@v4
        with:
          name: pimalaya-arm64-v8a
          path: pimalaya-arm64-v8a.apk
      - uses: actions/upload-artifact@v4
        with:
          name: pimalaya-armeabi-v7a
          path: pimalaya-armeabi-v7a.apk
      - uses: actions/upload-artifact@v4
        with:
          name: pimalaya-x86_64
          path: pimalaya-x86_64.apk
      - uses: actions/upload-artifact@v4
        with:
          name: pimalaya-x86
          path: pimalaya-x86.apk
      - uses: softprops/action-gh-release@v2
        if: ${{ startsWith(github.ref, 'refs/tags/') }}
        with:
          files: |
            pimalaya.apk
            pimalaya-arm64-v8a.apk
            pimalaya-armeabi-v7a.apk
            pimalaya-x86_64.apk
            pimalaya-x86.apk
