name: Tests

on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master

jobs:
  tests:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: cachix/install-nix-action@v31
        with:
          extra_nix_config: experimental-features = nix-command flakes
      - uses: cachix/cachix-action@v17
        with:
          name: soywod
          authToken: ${{ secrets.CACHIX_AUTH_TOKEN }}
          extraPullNames: nix-community
      - name: Clippy
        run: nix develop --command bash -c 'cd rust && cargo clippy --all-targets --locked -- -D warnings'
      - name: Rust tests
        run: nix develop --command bash -c 'cd rust && cargo test --locked'
      # The unit tests load the host libpimalaya.so (cargoHostBuild), and
      # preBuild cross-compiles the bridge for every ABI as in releases.yml.
      - name: Android unit tests
        run: nix develop --command gradle -p android :app:testDebugUnitTest --console=plain
