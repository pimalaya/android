name: Tests

on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-24.04
    env:
      # The devshell moves Gradle's home into the repository (flake.nix);
      # setup-gradle caches the one this names, so both agree.
      GRADLE_USER_HOME: ${{ github.workspace }}/android/.gradle-home
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: cachix/install-nix-action@3dc140bfc76c49fbd4dd958429132e3746bcb086 # v31.11.5
        with:
          extra_nix_config: experimental-features = nix-command flakes
      # NOTE: no token: the public cache pulls without one, and only
      # releases.yml pushes to it.
      - uses: cachix/cachix-action@38b082610b782e7e93e209c35fd730d399dee866 # v17
        with:
          name: soywod
          skipPush: true
          extraPullNames: nix-community
      # NOTE: the runner's own cargo computes the key, so the flake lock
      # joins it: a toolchain bump in the devshell starts a fresh cache.
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: rust -> target
          key: ${{ hashFiles('flake.lock') }}
      - uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
      - name: Clippy
        run: nix develop --command bash -c 'cd rust && cargo clippy --all-targets --locked -- -D warnings'
      # NOTE: the published io-pimdir leaves its spec vectors out, so the
      # tests read them from what Cargo.lock locks: the commit of a git
      # source, else the tag of its version.
      - name: io-pimdir spec
        run: |
          lock=$(grep -A2 '^name = "io-pimdir"$' rust/Cargo.lock)
          version=$(sed -n 's/^version = "\(.*\)"$/\1/p' <<< "$lock")
          commit=$(sed -n 's/^source = "git+.*#\(.*\)"$/\1/p' <<< "$lock")
          git init -q "$RUNNER_TEMP/io-pimdir"
          git -C "$RUNNER_TEMP/io-pimdir" fetch -q --depth 1 https://github.com/pimalaya/io-pimdir "${commit:-refs/tags/v$version}"
          git -C "$RUNNER_TEMP/io-pimdir" checkout -q FETCH_HEAD
          echo "PIMALAYA_IO_PIMDIR_SPEC=$RUNNER_TEMP/io-pimdir/spec" >> "$GITHUB_ENV"
      - name: Rust tests
        run: nix develop --command bash -c 'cd rust && cargo test --locked'
      # The unit tests load the host libpimalaya.so (cargoHostBuild), and
      # preBuild cross-compiles the bridge for every ABI as in releases.yml.
      - name: Android unit tests
        run: nix develop --command gradle -p android :app:testDebugUnitTest --console=plain
