<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Sync dock opened</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap">
<style>
body{margin:0}
a{color:inherit}a:hover{color:inherit}
.app{--bg:#FFFFFF;--surface:#EEEEEE;--divl:#E0E0E0;--fg:#1C1B1F;--fg2:#5E5E62;width:390px;height:844px;overflow:hidden;position:relative;background:var(--bg);color:var(--fg);font-family:Roboto,system-ui,sans-serif}
.app.dark{--bg:#1C1E21;--surface:#2A2A2A;--divl:#363636;--fg:#E6E1E5;--fg2:#AEAAAE}
.app *{box-sizing:border-box}
.ico{width:24px;height:24px;fill:currentColor;flex:none}
.ph{margin:0 12px 12px;background:var(--surface);border-radius:22px}
.scrim{position:absolute;inset:0;background:rgba(0,0,0,.4)}
.sheet{position:absolute;left:0;right:0;bottom:0;background:var(--bg);border-radius:28px 28px 0 0;padding:10px 0 24px;box-shadow:0 -4px 16px rgba(0,0,0,.2)}
.card{margin:0 12px;background:var(--surface);border-radius:22px;overflow:hidden}
.ar{display:flex;align-items:center;gap:14px;padding:12px 16px;position:relative}
.ar+.ar::before{content:"";position:absolute;top:0;left:52px;right:0;height:1px;background:var(--divl)}
.spin{width:22px;height:22px;border-radius:50%;border:3px solid transparent;border-top-color:var(--accent);border-right-color:var(--accent);flex:none}
.wait{width:22px;height:22px;border-radius:50%;border:3px solid var(--divl);flex:none}
.sh{padding:20px 16px 8px 24px;font-size:13px;font-weight:700;letter-spacing:.02em;text-transform:uppercase;color:var(--fg2)}
.log{margin:0 12px;background:var(--surface);border-radius:22px;padding:12px 16px;display:flex;flex-direction:column;gap:6px;font-size:13px;line-height:18px}
.log .t{color:var(--fg2);font-variant-numeric:tabular-nums;margin-right:8px}
</style>
</helmet>
<div class="{{theme}}" style="{{vars}}">
  <div style="padding: 68px 20px 0; font-size: 32px; font-weight: 700">Emails</div>
  <div class="ph" style="height: 260px; margin-top: 60px"></div>
  <a class="scrim" href="SyncDock.dc.html" aria-label="Close"></a>
  <div class="sheet" role="dialog" aria-label="Sync details">
    <div style="width: 32px; height: 4px; border-radius: 2px; background: var(--divl); margin: 0 auto 14px"></div>
    <div style="display: flex; align-items: center; padding: 0 12px 0 24px">
      <div style="flex: 1; font-size: 22px; font-weight: 700">Syncing</div>
      <span style="font-size: 13px; color: var(--fg2); margin-right: 4px">42%</span>
      <a href="SyncDock.dc.html" aria-label="Collapse" style="width: 48px; height: 48px; display: flex; align-items: center; justify-content: center; color: var(--fg2)"><svg class="ico" viewBox="0 -960 960 960"><path d="M480-344 240-584l56-56 184 184 184-184 56 56-240 240Z"/></svg></a>
    </div>
    <div style="margin: 4px 24px 16px; height: 4px; border-radius: 2px; background: var(--surface); overflow: hidden"><div style="width: 42%; height: 100%; background: var(--accent)"></div></div>
    <div class="card">
      <div class="ar"><div class="spin" aria-hidden="true"></div><div style="flex: 1; min-width: 0"><div style="font-size: 15px; font-weight: 700">alex@example.org</div><div style="font-size: 13px; color: var(--fg2)">Syncing mail · Downloading 42 messages</div></div></div>
      <div class="ar"><div class="wait" aria-hidden="true"></div><div style="flex: 1; min-width: 0"><div style="font-size: 15px">alex@fastmail.example</div><div style="font-size: 13px; color: var(--fg2)">Next</div></div></div>
    </div>
    <div class="sh">Recent</div>
    <div class="log">
      <div><span class="t">10:42:12</span>alex@example.org · Downloading 42 messages</div>
      <div><span class="t">10:42:09</span>alex@example.org · Mailboxes synced: 3 of 12</div>
      <div><span class="t">10:42:05</span>alex@example.org · Checking the server for changes</div>
      <div><span class="t">10:42:04</span>Starting the sync</div>
    </div>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"dark":{"editor":"boolean","default":false},"accent":{"editor":"color","default":"#00696F","options":["#00696F","#4F5BD5","#8E4585","#9A5B00"]},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    var dark = this.props.dark ?? false;
    var accent = this.props.accent ?? '#00696F';
    if (dark && accent === '#00696F') accent = '#80DEEA';
    var h = accent.replace('#', '');
    var r = parseInt(h.substr(0, 2), 16), g = parseInt(h.substr(2, 2), 16), b = parseInt(h.substr(4, 2), 16);
    var onAccent = (0.299 * r + 0.587 * g + 0.114 * b) > 150 ? '#000000' : '#FFFFFF';
    return { theme: dark ? 'app dark' : 'app', vars: '--accent:' + accent + ';--on-accent:' + onAccent };
  }
}
</script>
</body>
</html>
