<script type="text/x-dc" data-dc-script data-props='{"dark":{"editor":"boolean","default":false},"avatars":{"editor":"enum","options":["tonal","brand","solid","before"],"default":"tonal"},"serif":{"editor":"boolean","default":false},"accent":{"editor":"color","default":"#BF1E83","options":["#BF1E83","#97156A","#EFA3C8","#E267A3"]},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    var dark = this.props.dark ?? false;
    var serif = this.props.serif ?? false;
    var accent = this.props.accent ?? '#BF1E83';
    if (dark && accent.toUpperCase() === '#BF1E83') accent = '#EFA3C8';
    var h = accent.replace('#', '');
    var lin = function (v) { v = v / 255; return v <= 0.03928 ? v / 12.92 : Math.pow((v + 0.055) / 1.055, 2.4); };
    var l = 0.2126 * lin(parseInt(h.substr(0, 2), 16)) + 0.7152 * lin(parseInt(h.substr(2, 2), 16)) + 0.0722 * lin(parseInt(h.substr(4, 2), 16));
    var onAccent = l > 0.179 ? '#410B2B' : '#FFFFFF';
    var theme = 'app' + (dark ? ' dark' : '') + (serif ? ' serif' : '') + ' av-' + (this.props.avatars ?? 'tonal');
    var vars = '--accent:' + accent + ';--on-accent:' + onAccent;
    return { theme: theme, vars: vars };
  }
}
