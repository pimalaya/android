<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Advanced: services</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap">
<style>
body{margin:0}
a{color:inherit}a:hover{color:inherit}
.app{--bg:#FFFFFF;--surface:#EEEEEE;--divl:#E0E0E0;--fg:#1C1B1F;--fg2:#5E5E62;--track:#BDBDBD;width:390px;height:844px;overflow:hidden;position:relative;background:var(--bg);color:var(--fg);font-family:Roboto,system-ui,sans-serif;display:flex;flex-direction:column}
.app.dark{--bg:#1C1E21;--surface:#2A2A2A;--divl:#363636;--fg:#E6E1E5;--fg2:#AEAAAE;--track:#5A5A5A}
.app *{box-sizing:border-box}
.ico{width:24px;height:24px;fill:currentColor;flex:none}
.tbtn{width:40px;height:40px;margin:4px;border-radius:999px;background:var(--surface);color:var(--fg);display:flex;align-items:center;justify-content:center;flex:none;text-decoration:none}
.card{background:var(--surface);border-radius:22px;overflow:hidden;margin-top:12px}
.dh{display:flex;align-items:center;gap:14px;min-height:60px;padding:0 16px 0 14px}
.tile{width:32px;height:32px;border-radius:10px;background:var(--bg);display:flex;align-items:center;justify-content:center;flex:none}
.tile .ico{width:20px;height:20px}
.dn{flex:1;font-size:16px;font-weight:700}
.tg{width:44px;height:24px;border-radius:12px;background:color-mix(in srgb, var(--accent) 45%, transparent);position:relative;flex:none}
.tg::after{content:"";position:absolute;right:0;top:0;width:24px;height:24px;border-radius:50%;background:var(--accent);box-shadow:0 1px 3px rgba(0,0,0,.3)}
.tg.off{background:var(--track)}
.tg.off::after{left:0;right:auto;background:#FAFAFA}
.opt{display:flex;align-items:center;gap:14px;min-height:56px;padding:8px 16px 8px 20px;position:relative}
.opt::before{content:"";position:absolute;top:0;left:60px;right:0;height:1px;background:var(--divl)}
.rd{width:20px;height:20px;border-radius:50%;border:2px solid var(--fg2);flex:none;margin-right:6px}
.rd.on{border-color:var(--accent);box-shadow:inset 0 0 0 3px var(--surface);background:var(--accent)}
.ol{flex:1;min-width:0;display:flex;flex-direction:column}
.ol .p{font-size:16px}
.ol .s{font-size:13px;color:var(--fg2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sub{padding:16px 16px 6px 60px;font-size:13px;font-weight:700;letter-spacing:.02em;text-transform:uppercase;color:var(--fg2)}
.primary{height:56px;border-radius:999px;background:var(--accent);color:var(--on-accent);display:flex;align-items:center;justify-content:center;font-size:16px;font-weight:700;text-decoration:none}
</style>
</helmet>
<div class="{{theme}}" style="{{vars}}">
  <div style="min-height: 60px; padding: 0 8px; display: flex; align-items: center; flex: none">
    <a class="tbtn" href="NewWelcome.dc.html" aria-label="Back"><svg class="ico" viewBox="0 -960 960 960"><path d="m313-440 224 224-57 56-320-320 320-320 57 56-224 224h487v80H313Z"/></svg></a>
  </div>
  <div style="flex: 1; min-height: 0; overflow: hidden; padding: 8px 24px 0">
    <div style="display: flex; align-items: center; gap: 6px; font-size: 14px; color: var(--fg2)"><svg class="ico" style="width: 18px; height: 18px; color: var(--accent)" viewBox="0 -960 960 960"><path d="M382-240 154-468l57-57 171 171 367-367 57 57-424 424Z"/></svg>alex@fastmail.example</div>
    <div style="margin-top: 8px; font-size: 28px; font-weight: 700; line-height: 34px">How should each one connect?</div>
    <div style="margin-top: 8px; font-size: 14px; line-height: 20px; color: var(--fg2)">Pick a server and a sign-in for each. Switch off what you do not want on this phone.</div>
    <div class="card" style="margin-top: 20px">
      <label class="dh"><span class="tile"><svg class="ico" viewBox="0 -960 960 960"><path d="M160-160q-33 0-56.5-23.5T80-240v-480q0-33 23.5-56.5T160-800h640q33 0 56.5 23.5T880-720v480q0 33-23.5 56.5T800-160H160Zm320-280L160-640v400h640v-400L480-440Zm0-80 320-200H160l320 200ZM160-640v-80 480-400Z"/></svg></span><span class="dn">Mail</span><span class="tg"></span></label>
      <label class="opt"><span class="rd"></span><span class="ol"><span class="p">JMAP</span><span class="s">api.fastmail.example · OAuth 2.0</span></span></label>
      <label class="opt"><span class="rd on"></span><span class="ol"><span class="p">IMAP</span><span class="s">imap.fastmail.example · Password</span></span></label>
      <label class="opt"><span class="rd"></span><span class="ol"><span class="p">Enter settings manually</span><span class="s">Server, login and password</span></span></label>
      <div class="sub">Sending</div>
      <label class="opt"><span class="rd on"></span><span class="ol"><span class="p">SMTP</span><span class="s">smtp.fastmail.example:465 · Password</span></span></label>
      <label class="opt"><span class="rd"></span><span class="ol"><span class="p">Do not send from this account</span></span></label>
      <label class="opt"><span class="rd"></span><span class="ol"><span class="p">Enter settings manually</span></span></label>
    </div>
    <div class="card">
      <label class="dh"><span class="tile"><svg class="ico" viewBox="0 -960 960 960"><path d="M40-160v-112q0-34 17.5-62.5T104-378q62-31 126-46.5T360-440q66 0 130 15.5T616-378q29 15 46.5 43.5T680-272v112H40Zm720 0v-120q0-44-24.5-84.5T666-434q51 6 96 20.5t84 35.5q36 20 55 44.5t19 53.5v120H760ZM360-480q-66 0-113-47t-47-113q0-66 47-113t113-47q66 0 113 47t47 113q0 66-47 113t-113 47Zm400-160q0 66-47 113t-113 47q-11 0-28-2.5t-28-5.5q27-32 41.5-71t14.5-81q0-42-14.5-81T544-792q14-5 28-6.5t28-1.5q66 0 113 47t47 113ZM120-240h480v-32q0-11-5.5-20T580-306q-54-27-109-40.5T360-360q-56 0-111 13.5T140-306q-9 5-14.5 14t-5.5 20v32Zm240-320q33 0 56.5-23.5T440-640q0-33-23.5-56.5T360-720q-33 0-56.5 23.5T280-640q0 33 23.5 56.5T360-560Zm0 320Zm0-400Z"/></svg></span><span class="dn">Contacts</span><span class="tg"></span></label>
      <label class="opt"><span class="rd"></span><span class="ol"><span class="p">JMAP</span><span class="s">api.fastmail.example · OAuth 2.0</span></span></label>
      <label class="opt"><span class="rd on"></span><span class="ol"><span class="p">CardDAV</span><span class="s">carddav.fastmail.example · Password</span></span></label>
      <label class="opt"><span class="rd"></span><span class="ol"><span class="p">Enter settings manually</span><span class="s">Server, login and password</span></span></label>
    </div>
    <div class="card">
      <label class="dh"><span class="tile"><svg class="ico" viewBox="0 -960 960 960"><path d="M180-80q-24 0-42-18t-18-42v-620q0-24 18-42t42-18h65v-60h65v60h340v-60h65v60h65q24 0 42 18t18 42v620q0 24-18 42t-42 18H180Zm0-60h600v-430H180v430Zm0-490h600v-130H180v130Z"/></svg></span><span class="dn">Calendar</span><span class="tg off"></span></label>
    </div>
  </div>
  <div style="padding: 12px 24px 16px; flex: none; background: var(--bg)">
    <a class="primary" href="AdvSignIn.dc.html">Continue</a>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"dark":{"editor":"boolean","default":false},"accent":{"editor":"color","default":"#00696F","options":["#00696F","#4F5BD5","#8E4585","#9A5B00"]},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    var dark = this.props.dark ?? false;
    var accent = this.props.accent ?? '#00696F';
    if (dark && accent === '#00696F') accent = '#80DEEA';
    var h = accent.replace('#', '');
    var r = parseInt(h.substr(0, 2), 16), g = parseInt(h.substr(2, 2), 16), b = parseInt(h.substr(4, 2), 16);
    var onAccent = (0.299 * r + 0.587 * g + 0.114 * b) > 150 ? '#000000' : '#FFFFFF';
    return { theme: dark ? 'app dark' : 'app', vars: '--accent:' + accent + ';--on-accent:' + onAccent };
  }
}
</script>
</body>
</html>
