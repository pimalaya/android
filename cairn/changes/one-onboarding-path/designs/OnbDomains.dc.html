<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>One path: select your domains</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&family=Source+Serif+4:opsz,wght@8..60,600..700&display=swap">
<style>
body{margin:0}
a{color:inherit}a:hover{color:inherit}
.app{--bg:#FFFFFF;--surface:#F9F1F3;--divl:#ECD9E1;--fg:#301F2A;--fg2:#6F5464;--track:#D9BFCB;--wash:#F7D9EA;--accent-ink:#97156A;width:390px;height:844px;overflow:hidden;position:relative;background:var(--bg);color:var(--fg);font-family:Roboto,system-ui,sans-serif;display:flex;flex-direction:column}
.app.dark{--bg:#1A0D15;--surface:#23121C;--divl:rgba(247,233,240,.1);--fg:#F7E9F0;--fg2:#BB9CAD;--track:#5A4351;--wash:#422032;--accent-ink:#F193B6}
.app.rosy{--bg:#F9F1F3;--surface:#FDF9FA}
.app.rosy.dark{--bg:#1A0D15;--surface:#23121C}
.app.rosy .card,.app.rosy .sec,.app.rosy .tbtn{box-shadow:inset 0 0 0 1px var(--divl)}
.app .tonal{background:var(--wash);color:var(--accent-ink)}
.app .text{color:var(--accent-ink)}
.hd{font-weight:700}
.app.serif .h,.app.serif .hd{font-family:'Source Serif 4',Georgia,serif;font-weight:600;letter-spacing:-.01em}
.app *{box-sizing:border-box}
.ico{width:24px;height:24px;fill:currentColor;flex:none}
.bar{min-height:60px;padding:0 8px;display:flex;align-items:center;flex:none}
.tbtn{width:40px;height:40px;margin:4px;border-radius:999px;background:var(--surface);color:var(--fg);display:flex;align-items:center;justify-content:center;flex:none;text-decoration:none}
.body{flex:1;min-height:0;overflow:hidden;padding:8px 24px 0;display:flex;flex-direction:column}
.who{display:flex;align-items:center;gap:6px;min-height:20px;font-size:14px;color:var(--fg2)}
.h{margin-top:8px;font-size:28px;font-weight:700;line-height:34px}
.sub{margin-top:8px;font-size:14px;line-height:20px;color:var(--fg2)}
.card{background:var(--surface);border-radius:22px;overflow:hidden;flex:none}
.tile{width:32px;height:32px;border-radius:10px;background:var(--bg);display:flex;align-items:center;justify-content:center;flex:none}
.tile .ico{width:20px;height:20px}
.drow{display:flex;align-items:center;gap:14px;min-height:60px;padding:0 8px 0 14px;position:relative;cursor:pointer;width:100%;border:0;background:none;font:inherit;color:inherit;text-align:left}
.drow+.drow::before{content:"";position:absolute;top:0;left:58px;right:0;height:1px;background:var(--divl)}
.dl{flex:1;font-size:16px}
.cbx{width:48px;height:48px;display:flex;align-items:center;justify-content:center;color:var(--accent)}
.cbx .off{color:var(--fg2)}
.foot{padding:12px 24px 16px;flex:none;background:var(--bg);display:flex;flex-direction:column;gap:4px}
.primary{height:56px;border-radius:999px;background:var(--accent);color:var(--on-accent);display:flex;align-items:center;justify-content:center;gap:8px;font-size:16px;font-weight:700;text-decoration:none}
.primary.dis{opacity:.4}
</style>
</helmet>
<div class="{{theme}}" style="{{vars}}">
  <div class="bar"><a class="tbtn" href="OnbAddress.dc.html" aria-label="Back"><svg class="ico" viewBox="0 -960 960 960" aria-hidden="true"><path d="m313-440 224 224-57 56-320-320 320-320 57 56-224 224h487v80H313Z"/></svg></a></div>
  <div class="body">
    <div class="who">alex@example.org</div>
    <div class="h">Select your domains</div>
    <div class="sub">You can add the others later.</div>
    <div class="card" style="margin-top: 20px">
      <button class="drow" type="button" aria-pressed="{{mailPressed}}" onClick="{{togMail}}"><span class="tile"><svg class="ico" viewBox="0 -960 960 960" aria-hidden="true"><path d="M160-160q-33 0-56.5-23.5T80-240v-480q0-33 23.5-56.5T160-800h640q33 0 56.5 23.5T880-720v480q0 33-23.5 56.5T800-160H160Zm320-280L160-640v400h640v-400L480-440Zm0-80 320-200H160l320 200ZM160-640v-80 480-400Z"/></svg></span><span class="dl">Mail</span><span class="cbx"><sc-if value="{{mail}}" hint-placeholder-val="{{ false }}"><svg class="ico" viewBox="0 -960 960 960" aria-hidden="true"><path d="m424-312 282-282-56-56-226 226-114-114-56 56 170 170ZM200-120q-33 0-56.5-23.5T120-200v-560q0-33 23.5-56.5T200-840h560q33 0 56.5 23.5T840-760v560q0 33-23.5 56.5T760-120H200Zm0-80h560v-560H200v560Zm0-560v560-560Z"/></svg></sc-if><sc-if value="{{noMail}}" hint-placeholder-val="{{ true }}"><svg class="ico off" viewBox="0 -960 960 960" aria-hidden="true"><path d="M200-120q-33 0-56.5-23.5T120-200v-560q0-33 23.5-56.5T200-840h560q33 0 56.5 23.5T840-760v560q0 33-23.5 56.5T760-120H200Zm0-80h560v-560H200v560Z"/></svg></sc-if></span></button>
      <button class="drow" type="button" aria-pressed="{{contactsPressed}}" onClick="{{togContacts}}"><span class="tile"><svg class="ico" viewBox="0 -960 960 960" aria-hidden="true"><path d="M40-160v-112q0-34 17.5-62.5T104-378q62-31 126-46.5T360-440q66 0 130 15.5T616-378q29 15 46.5 43.5T680-272v112H40Zm720 0v-120q0-44-24.5-84.5T666-434q51 6 96 20.5t84 35.5q36 20 55 44.5t19 53.5v120H760ZM360-480q-66 0-113-47t-47-113q0-66 47-113t113-47q66 0 113 47t47 113q0 66-47 113t-113 47Zm400-160q0 66-47 113t-113 47q-11 0-28-2.5t-28-5.5q27-32 41.5-71t14.5-81q0-42-14.5-81T544-792q14-5 28-6.5t28-1.5q66 0 113 47t47 113ZM120-240h480v-32q0-11-5.5-20T580-306q-54-27-109-40.5T360-360q-56 0-111 13.5T140-306q-9 5-14.5 14t-5.5 20v32Zm240-320q33 0 56.5-23.5T440-640q0-33-23.5-56.5T360-720q-33 0-56.5 23.5T280-640q0 33 23.5 56.5T360-560Zm0 320Zm0-400Z"/></svg></span><span class="dl">Contacts</span><span class="cbx"><sc-if value="{{contacts}}" hint-placeholder-val="{{ false }}"><svg class="ico" viewBox="0 -960 960 960" aria-hidden="true"><path d="m424-312 282-282-56-56-226 226-114-114-56 56 170 170ZM200-120q-33 0-56.5-23.5T120-200v-560q0-33 23.5-56.5T200-840h560q33 0 56.5 23.5T840-760v560q0 33-23.5 56.5T760-120H200Zm0-80h560v-560H200v560Zm0-560v560-560Z"/></svg></sc-if><sc-if value="{{noContacts}}" hint-placeholder-val="{{ true }}"><svg class="ico off" viewBox="0 -960 960 960" aria-hidden="true"><path d="M200-120q-33 0-56.5-23.5T120-200v-560q0-33 23.5-56.5T200-840h560q33 0 56.5 23.5T840-760v560q0 33-23.5 56.5T760-120H200Zm0-80h560v-560H200v560Z"/></svg></sc-if></span></button>
      <button class="drow" type="button" aria-pressed="{{calendarPressed}}" onClick="{{togCalendar}}"><span class="tile"><svg class="ico" viewBox="0 -960 960 960" aria-hidden="true"><path d="M180-80q-24 0-42-18t-18-42v-620q0-24 18-42t42-18h65v-60h65v60h340v-60h65v60h65q24 0 42 18t18 42v620q0 24-18 42t-42 18H180Zm0-60h600v-430H180v430Zm0-490h600v-130H180v130Z"/></svg></span><span class="dl">Calendar</span><span class="cbx"><sc-if value="{{calendar}}" hint-placeholder-val="{{ false }}"><svg class="ico" viewBox="0 -960 960 960" aria-hidden="true"><path d="m424-312 282-282-56-56-226 226-114-114-56 56 170 170ZM200-120q-33 0-56.5-23.5T120-200v-560q0-33 23.5-56.5T200-840h560q33 0 56.5 23.5T840-760v560q0 33-23.5 56.5T760-120H200Zm0-80h560v-560H200v560Zm0-560v560-560Z"/></svg></sc-if><sc-if value="{{noCalendar}}" hint-placeholder-val="{{ true }}"><svg class="ico off" viewBox="0 -960 960 960" aria-hidden="true"><path d="M200-120q-33 0-56.5-23.5T120-200v-560q0-33 23.5-56.5T200-840h560q33 0 56.5 23.5T840-760v560q0 33-23.5 56.5T760-120H200Zm0-80h560v-560H200v560Z"/></svg></sc-if></span></button>
    </div>
  </div>
  <div class="foot">
    <sc-if value="{{any}}" hint-placeholder-val="{{ false }}"><a class="primary" href="OnbConnect.dc.html">Continue</a></sc-if>
    <sc-if value="{{none}}" hint-placeholder-val="{{ true }}"><span class="primary dis" aria-disabled="true">Continue</span></sc-if>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"dark":{"editor":"boolean","default":false},"layering":{"editor":"enum","options":["app","website"],"default":"app"},"serif":{"editor":"boolean","default":true},"accent":{"editor":"color","default":"#BF1E83","options":["#BF1E83","#97156A","#E267A3","#00696F"]},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    var dark = this.props.dark ?? false;
    var rosy = (this.props.layering ?? 'app') === 'website';
    var serif = this.props.serif ?? true;
    var accent = this.props.accent ?? '#BF1E83';
    if (dark && accent.toUpperCase() === '#BF1E83') accent = '#E267A3';
    var h = accent.replace('#', '');
    var lin = function (v) { v = v / 255; return v <= 0.03928 ? v / 12.92 : Math.pow((v + 0.055) / 1.055, 2.4); };
    var l = 0.2126 * lin(parseInt(h.substr(0, 2), 16)) + 0.7152 * lin(parseInt(h.substr(2, 2), 16)) + 0.0722 * lin(parseInt(h.substr(4, 2), 16));
    var onAccent = l > 0.179 ? '#1A0D15' : '#FFFFFF';
    var self = this;
    var s = this.state || {};
    var flip = function (key) {
      return function () {
        var now = self.state || {};
        var next = {};
        next[key] = !now[key];
        self.setState(next);
      };
    };
    var any = !!(s.mail || s.contacts || s.calendar);
    return {
      theme: 'app' + (dark ? ' dark' : '') + (rosy ? ' rosy' : '') + (serif ? ' serif' : ''),
      vars: '--accent:' + accent + ';--on-accent:' + onAccent,
      mail: !!s.mail, noMail: !s.mail, mailPressed: s.mail ? 'true' : 'false', togMail: flip('mail'),
      contacts: !!s.contacts, noContacts: !s.contacts, contactsPressed: s.contacts ? 'true' : 'false', togContacts: flip('contacts'),
      calendar: !!s.calendar, noCalendar: !s.calendar, calendarPressed: s.calendar ? 'true' : 'false', togCalendar: flip('calendar'),
      any: any, none: !any
    };
  }
}
</script>
</body>
</html>
