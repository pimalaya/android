[package]
name = "pimalaya"
description = "JNI bridge driving Pimalaya I/O-free coroutines for the Pimalaya Android client"
version = "0.1.0"
authors = ["Clément DOUIN (soywod) <pimalaya.org@posteo.net>"]
rust-version = "1.89"
edition = "2024"
license = "MIT OR Apache-2.0"
publish = false

[lib]
crate-type = ["cdylib"]

[profile.release]
lto = "fat"
codegen-units = 1
strip = "symbols"
opt-level = "s"

[dev-dependencies]
io-pimdir = { version = "0.9", features = ["client", "vendored"] }
rusqlite = { version = "0.41", default-features = false, features = ["bundled"] }
tempfile = { version = "3", default-features = false }

[dependencies]
chrono = { version = "0.4", default-features = false }
ical-rs = { version = "0.7", default-features = false, features = ["jscalendar", "parser"] }
io-gcal = { version = "0.3", default-features = false, features = ["ical"] }
io-gmail = { version = "0.6", default-features = false }
io-gpeople = { version = "0.6", default-features = false, features = ["vcard"] }
io-http = { version = "0.6", default-features = false }
io-imap = { version = "0.8", default-features = false }
io-jmap = { version = "0.7", default-features = false, features = ["ical", "vcard"] }
io-msgraph = { version = "0.7", default-features = false, features = ["ical", "vcard"] }
io-oauth = { version = "0.5", default-features = false }
io-pim-discovery = { version = "0.11", default-features = false, features = ["autoconfig", "pacc", "rfc6764", "rfc8414", "rfc8620"] }
io-pimdir = { version = "0.9", default-features = false, features = ["search"] }
io-smtp = { version = "0.7", default-features = false }
io-webdav = { version = "0.7", default-features = false }
jiff = { version = "0.2", default-features = false, features = ["std"] }
jni = "0.22"
libc = { version = "0.2", default-features = false }
log = { version = "0.4", default-features = false }
mime-rs = { version = "0.1", default-features = false, features = ["parser", "base64", "encoding"] }
percent-encoding = "2"
pulldown-cmark = { version = "0.13", default-features = false }
rand = "0.10"
secrecy = { version = "0.10", default-features = false, features = ["serde"] }
serde = { version = "1", default-features = false, features = ["alloc", "derive"] }
serde_json = { version = "1", default-features = false, features = ["alloc"] }
sha2 = { version = "0.11", default-features = false }
siphasher = { version = "1", default-features = false }
simd-cpu = { version = "0.1", default-features = false, features = ["std"] }
url = { version = "2", default-features = false }
vcard-rs = { version = "0.6", default-features = false, features = ["parser", "jscontact"] }
