[package]
name = "pimalaya"
description = "JNI bridge driving Pimalaya I/O-free coroutines for the Pimalaya Android client"
version = "0.1.0"
authors = ["Clément DOUIN (soywod) <pimalaya.org@posteo.net>"]
rust-version = "1.88"
edition = "2024"
license = "MIT OR Apache-2.0"
publish = false

[lib]
crate-type = ["cdylib"]

[profile.release]
lto = "fat"
codegen-units = 1
strip = "symbols"
opt-level = "s"
# NOTE: no `panic = "abort"`: every export catches a panic at the JNI
# boundary (`EnvUnowned::with_env`) and answers it as an error reply.

[dev-dependencies]
# NOTE: the std store, for the tests running the real sync engine and store
# over a fake provider; the bridge itself compiles no SQLite.
io-pimdir = { version = "0.8", features = ["client", "vendored"] }
tempfile = { version = "3", default-features = false }

[dependencies]
chrono = { version = "0.4", default-features = false }
ical-rs = { version = "0.6.1", default-features = false, features = ["jscalendar", "parser"] }
io-gcal = { version = "0.2", default-features = false, features = ["ical"] }
io-gmail = { version = "0.5", default-features = false }
io-gpeople = { version = "0.5", default-features = false, features = ["vcard"] }
io-http = { version = "0.5", default-features = false }
io-imap = { version = "0.7", default-features = false }
io-jmap = { version = "0.6", default-features = false, features = ["ical", "vcard"] }
io-msgraph = { version = "0.6", default-features = false, features = ["ical", "vcard"] }
io-oauth = { version = "0.3", default-features = false }
io-pim-discovery = { version = "0.9", default-features = false, features = ["autoconfig", "pacc", "rfc6764", "rfc8414", "rfc8620"] }
io-pimdir = { version = "0.8", default-features = false }
io-smtp = { version = "0.5", default-features = false }
io-webdav = { version = "0.5", default-features = false }
jiff = { version = "0.2", default-features = false, features = ["std"] }
jni = "0.22"
log = { version = "0.4", default-features = false }
mail-parser = { version = "0.11", default-features = false, features = ["full_encoding"] }
percent-encoding = "2"
pulldown-cmark = { version = "0.13", default-features = false }
rand = "0.10"
secrecy = { version = "0.10", default-features = false, features = ["serde"] }
serde = { version = "1", default-features = false, features = ["alloc", "derive"] }
serde_json = { version = "1", default-features = false, features = ["alloc"] }
sha2 = { version = "0.11", default-features = false }
siphasher = { version = "1", default-features = false }
url = { version = "2", default-features = false }
vcard-rs = { version = "0.5", default-features = false, features = ["parser", "jscontact"] }

[patch.crates-io]
io-jmap = { git = "https://github.com/pimalaya/io-jmap", rev = "3d25e2ba5194a494028a04d60a23bfb61b16f5aa" }
io-msgraph = { git = "https://github.com/pimalaya/io-msgraph", rev = "2ae26370aefa671c16316dbad98107634436bce6" }
# NOTE: unreleased fixes, to be replaced by released versions.
ical-rs = { git = "https://github.com/pimalaya/ical", rev = "caa14225152a7aff6d8c86cef1f95e800dd77d20" }
io-http = { git = "https://github.com/pimalaya/io-http", rev = "e1815307771c1ec65a86b77256d46c33241d3038" }
io-imap = { git = "https://github.com/pimalaya/io-imap", rev = "b1ab38ea9f24578b46dda56aa009600571b6b9ef" }
io-pimdir = { git = "https://github.com/pimalaya/io-pimdir", rev = "189db408bdbeee33c1c535709c5f40f3464c7ecb" }
io-webdav = { git = "https://github.com/pimalaya/io-webdav", rev = "62fad898d1ecb3ebb25c37826a79eb72fcd54d7f" }
