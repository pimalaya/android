[package]
name = "pimalaya"
description = "JNI bridge driving Pimalaya I/O-free coroutines for the Pimalaya Android client"
version = "0.1.0"
authors = ["Clément DOUIN (soywod) <pimalaya.org@posteo.net>"]
rust-version = "1.88"
edition = "2024"
license = "MIT OR Apache-2.0"
publish = false

[lib]
crate-type = ["cdylib"]

[dependencies]
chrono = { version = "0.4", default-features = false }
ical-rs = { version = "0.5", default-features = false, features = ["jscalendar", "parser"] }
io-gcal = { version = "0.1", default-features = false, features = ["ical"] }
io-gmail = { version = "0.4", default-features = false }
io-gpeople = { version = "0.4", default-features = false, features = ["vcard"] }
io-http = { version = "0.5", default-features = false }
io-imap = { version = "0.7", default-features = false }
io-jmap = { version = "0.4", default-features = false }
io-msgraph = { git = "https://github.com/pimalaya/io-msgraph", rev = "00ef069234d1a97335ea174f918491b703f39238", default-features = false, features = ["ical", "vcard"] }
io-oauth = { version = "0.3", default-features = false }
io-pim-discovery = { version = "0.9", default-features = false, features = ["autoconfig", "pacc", "rfc6764", "rfc8414", "rfc8620"] }
io-pimdir = { git = "https://github.com/pimalaya/io-pimdir", rev = "ff28408a7834cc43cdd6e7229510174a783356fd", default-features = false }
io-smtp = { version = "0.5", default-features = false }
io-webdav = { version = "0.5", default-features = false }
jiff = { version = "0.2", default-features = false, features = ["std"] }
jni = "0.22"
log = { version = "0.4", default-features = false }
mail-parser = { version = "0.11", default-features = false, features = ["full_encoding"] }
percent-encoding = "2"
rand = "0.10"
secrecy = { version = "0.10", default-features = false }
serde = { version = "1", default-features = false, features = ["alloc", "derive"] }
serde_json = { version = "1", default-features = false, features = ["alloc"] }
sha2 = { version = "0.11", default-features = false }
url = { version = "2", default-features = false }
vcard-rs = { version = "0.5", default-features = false, features = ["parser", "jscontact"] }

[dev-dependencies]
# NOTE: the std store, for the Graph listing's tests to run the real sync
# engine and store over a fake Graph; the bridge itself compiles no SQLite.
io-pimdir = { git = "https://github.com/pimalaya/io-pimdir", rev = "ff28408a7834cc43cdd6e7229510174a783356fd", features = ["client", "vendored"] }
tempfile = { version = "3", default-features = false }
