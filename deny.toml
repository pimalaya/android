# Read by `cargo deny check` from rust/ (.github/workflows/audit.yml).

[graph]
# An advisory behind an optional feature is reported too.
all-features = true

[advisories]
yanked = "deny"
ignore = [
  { id = "RUSTSEC-2026-0543", reason = "chrono is imposed by imap-types' public NaiveDate; the switch away is in progress upstream, imap-codec issue 752" },
]

[bans]
multiple-versions = "warn"

[sources]
# crates.io only, but io-pimdir taken from git while rust/Cargo.toml patches
# it (dropped with the patch once io-pimdir 0.20.0 is released).
allow-git = ["https://github.com/pimalaya/io-pimdir"]
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
unknown-git = "deny"
unknown-registry = "deny"

[licenses]
allow = [
  "Apache-2.0",
  "BSD-3-Clause",
  "MIT",
  "Unicode-3.0",
  "Zlib",
]
